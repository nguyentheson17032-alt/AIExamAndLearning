spring:
  application:
    name: exam-warehouse
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/exam_warehouse}
    username: ${DATABASE_USERNAME:exam}
    password: ${DATABASE_PASSWORD:exam}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 7d
  elo:
    default-rating: 1000
    k-factor: 24
  ai:
    enabled: ${APP_AI_ENABLED:false}
    model-name: ${OPENAI_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health
